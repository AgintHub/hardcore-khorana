dag_type: plain_text
description: An application that visualizes the song history while listening to audio
  and lists any interpolations within the song in real-time.
name: music_analysis_tool
nodes:
  analyze_audio:
    agent: false
    description: Extract key metadata from the audio file.
    name: analyze_audio
    nodes_depended_on: []
    nodes_dependent_on:
    - extract_audio_features
    prompt: Analyze the audio file using the Librosa library to extract its metadata,
      including title, artist, and duration.
  display_audio:
    agent: false
    description: Display the analyzed audio file in a visualizer.
    name: display_audio
    nodes_depended_on:
    - analyze_audio
    nodes_dependent_on: []
    prompt: Display the audio file in a visualizer, such as a waveform or spectrogram.
  display_interpolations:
    agent: false
    description: Display the analyzed audio file's metadata and list of interpolations
      in a user-friendly interface.
    name: display_interpolations
    nodes_depended_on:
    - list_interpolations
    - display_audio
    nodes_dependent_on: []
    prompt: Display the list of interpolations alongside the audio file's metadata.
  extract_audio_features:
    agent: false
    description: Calculate key audio features from the analyzed audio file.
    name: extract_audio_features
    nodes_depended_on:
    - analyze_audio
    nodes_dependent_on:
    - identify_interpolations
    prompt: Extract audio features, including pitch, tempo, and energy, using the
      Essentia library.
  identify_interpolations:
    agent: false
    description: Detect interpolations in the analyzed audio file.
    name: identify_interpolations
    nodes_depended_on:
    - analyze_audio
    - extract_audio_features
    nodes_dependent_on:
    - list_interpolations
    prompt: Identify interpolations within the audio file, including samples of previous
      songs, using the OpenSongLibrary library.
  list_interpolations:
    agent: false
    description: Display the list of interpolations for the analyzed audio file.
    name: list_interpolations
    nodes_depended_on:
    - analyze_audio
    - extract_audio_features
    - identify_interpolations
    nodes_dependent_on:
    - display_interpolations
    prompt: List the identified interpolations, including the original song title,
      artist, and duration.
