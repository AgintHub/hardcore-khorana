dag_type: plain_text
description: Identify possible song interpolations by extracting audio features, searching
  a music database with those features, optionally checking lyrical similarity, merging
  results, verifying candidates, and reporting the final interpolations.
name: identify_song_interpolations_refined
nodes:
  combine_candidate_lists:
    agent: false
    description: Merge audio and lyric candidate lists, weighting audio more heavily.
    name: combine_candidate_lists
    nodes_depended_on:
    - rank_audio_candidates
    - search_lyric_database
    nodes_dependent_on: []
    prompt: Cross‑reference the two candidate lists, apply a weighting (audio 60 %,
      lyrics 40 %), and output the top 5 combined candidates with a combined confidence
      score.
  extract_audio_features:
    agent: false
    description: Extract core audio characteristics such as tempo, key, and melodic
      contour from the validated file.
    name: extract_audio_features
    nodes_depended_on:
    - validate_audio_input
    nodes_dependent_on: []
    prompt: Analyze the audio file and output a JSON containing tempo (BPM), key,
      time signature, and a vector representing melodic and rhythmic patterns.
  extract_lyrics:
    agent: false
    description: Retrieve lyrical text from the audio file or its metadata.
    name: extract_lyrics
    nodes_depended_on:
    - validate_audio_input
    nodes_dependent_on: []
    prompt: If lyrics are embedded, extract them; otherwise run speech‑to‑text on
      the audio to produce plain‑text lyrics.
  generate_interpolation_report:
    agent: false
    description: Produce a final JSON report of confirmed interpolations.
    name: generate_interpolation_report
    nodes_depended_on:
    - verify_candidate_interpolations
    nodes_dependent_on: []
    prompt: Format the verified candidates as JSON objects containing song title,
      artist, timestamp range, match confidence (0‑1), and interpolation type. Include
      up to 5 entries.
  query_audio_feature_database:
    agent: false
    description: Search a music feature database for songs with similar audio characteristics.
    name: query_audio_feature_database
    nodes_depended_on:
    - extract_audio_features
    nodes_dependent_on: []
    prompt: Using the extracted audio feature JSON, compute similarity (e.g., cosine
      similarity) against a song database and return a list of the top 10 candidate
      songs with similarity scores.
  rank_audio_candidates:
    agent: false
    description: Select the strongest audio‑based candidates.
    name: rank_audio_candidates
    nodes_depended_on:
    - query_audio_feature_database
    nodes_dependent_on: []
    prompt: From the candidate list, keep the five highest‑scoring entries and output
      them as a JSON array.
  search_lyric_database:
    agent: false
    description: Find songs with overlapping lyrical phrases.
    name: search_lyric_database
    nodes_depended_on:
    - extract_lyrics
    nodes_dependent_on: []
    prompt: Compare the extracted lyrics against a lyric database using n‑gram matching
      and return up to 10 songs with phrase‑level similarity scores.
  validate_audio_input:
    agent: false
    description: Confirm the provided audio file is playable, correctly formatted,
      and not corrupted.
    name: validate_audio_input
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Validate that the supplied audio file is in a supported format (e.g.,
      MP3, WAV) and is not corrupted. Return a simple confirmation.
  verify_candidate_interpolations:
    agent: false
    description: Confirm that each candidate truly contains an interpolation segment.
    name: verify_candidate_interpolations
    nodes_depended_on:
    - combine_candidate_lists
    nodes_dependent_on: []
    prompt: For each candidate, align waveforms and timestamps, check for matching
      melodic fragments and, if available, matching lyric snippets. Return only those
      candidates that pass verification with a confidence rating.
