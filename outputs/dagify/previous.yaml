dag_type: plain_text
description: A workflow for analyzing a song input to identify all interpolations
  by extracting features, comparing against a database of songs, and returning the
  interpolated sources.
name: identify_song_interpolations
nodes:
  compare_audio_features_to_database:
    agent: false
    description: Search a music database for songs with matching or similar audio
      features.
    name: compare_audio_features_to_database
    nodes_depended_on:
    - extract_audio_features
    nodes_dependent_on:
    - merge_comparison_results
    prompt: Compare the extracted audio feature vectors against a song database using
      similarity algorithms (e.g., cosine similarity). Identify 5-10 top audio feature
      matches. Output list of candidate songs with scores.
  compare_lyrics_to_database:
    agent: false
    description: Search a music database for songs containing matching or similar
      lyrical phrases.
    name: compare_lyrics_to_database
    nodes_depended_on:
    - extract_lyrics
    nodes_dependent_on:
    - merge_comparison_results
    prompt: Analyze the extracted lyrics using NLP techniques to find direct quoted
      phrases, thematic overlaps, or word n-gram matches in a music database. Output
      list of candidate songs with phrase-level match confidence scores.
  extract_audio_features:
    agent: false
    description: Extract audio characteristics like tempo, key, melody, rhythm, and
      harmonic patterns.
    name: extract_audio_features
    nodes_depended_on:
    - validate_audio_input
    nodes_dependent_on:
    - compare_audio_features_to_database
    prompt: Analyze the validated audio file to extract standardized audio features
      including tempo (BPM), key, time signature, melodic contours, and rhythm patterns.
      Output a structured JSON of feature vectors.
  extract_lyrics:
    agent: false
    description: Extract textual lyrics from the audio file or metadata if available.
    name: extract_lyrics
    nodes_depended_on:
    - validate_audio_input
    nodes_dependent_on:
    - compare_lyrics_to_database
    prompt: Scan the validated audio file or metadata for human-lyrified text. Use
      speech-to-text conversion if lyrics are present. Output plain text of the extracted
      lyrics.
  generate_interpolation_report:
    agent: false
    description: Compile confirmed interpolations into a structured API response format.
    name: generate_interpolation_report
    nodes_depended_on:
    - verify_candidate_interpolations
    nodes_dependent_on: []
    prompt: 'Format confirmation results as JSON containing interpolation details:
      song title, artist, timestamp ranges used, match confidence (0-1), and type
      (full partial cover remix). List 3-5 most confirmed interpolations.'
  merge_comparison_results:
    agent: false
    description: Combine audio and lyric comparisons to identify strong interpolation
      candidates.
    name: merge_comparison_results
    nodes_depended_on:
    - compare_audio_features_to_database
    - compare_lyrics_to_database
    nodes_dependent_on:
    - verify_candidate_interpolations
    prompt: Cross-reference audio feature candidates and lyrical match candidates.
      Rank combined results by weighted similarity scores (audio=60%, lyrics=40%).
      Output top 5 combined candidates for verification.
  validate_audio_input:
    agent: false
    description: Verify the input audio file is valid and properly formatted.
    name: validate_audio_input
    nodes_depended_on: []
    nodes_dependent_on:
    - extract_audio_features
    - extract_lyrics
    prompt: Validate that the provided audio file is playable and in a supported format
      (e.g., MP3, WAV). Confirm the file is not corrupted or incomplete.
  verify_candidate_interpolations:
    agent: false
    description: Manually or algorithmically confirm interpolated segments in the
      source song.
    name: verify_candidate_interpolations
    nodes_depended_on:
    - merge_comparison_results
    nodes_dependent_on:
    - generate_interpolation_report
    prompt: For each merged candidate, analyze segment-level overlaps between target
      and candidate songs using waveform alignment and lyric timestamping. Confirm
      valid interpolations by matching lengths and exact phrases.
