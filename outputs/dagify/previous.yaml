dag_type: typed
description: Generated workflow from UI.
name: musical_interpolation_finder_service
nodes:
  extract_reference_audio_hash:
    agent: false
    description: Generate a spectrogram fingerprint or audio hash of the input song
      to establish a unique audio signature for matching.
    name: extract_reference_audio_hash
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Base64 or hexadecimal encoded string representing the audio fingerprint.
      key: hash_value
      type: str
    - description: Number of characters in the hash_value string.
      key: hash_length
      type: int
    - description: Indicates whether the hash was successfully generated from the
        input audio.
      key: is_valid
      type: bool
    prompt: Analyze the provided audio file and generate a unique spectrogram fingerprint
      or acoustic hash that represents the unique sonic characteristics of the track.
      Output the hash data.
  fingerprint_chord_sequence:
    agent: false
    description: Create a searchable signature of the chord progression to compare
      against known databases.
    name: fingerprint_chord_sequence
    nodes_depended_on:
    - isolate_harmonic_chord_progression
    nodes_dependent_on: []
    output_structure:
    - description: A normalized string representing the chord progression signature
      key: chord_progression_signature
      type: str
    - description: A vector signature representing the chord progression, suitable
        for database similarity matching
      key: vector_signature
      type: List[float]
    prompt: Transform the extracted chord progression into a normalized string or
      vector signature suitable for database similarity matching.
  format_interpolation_response:
    agent: false
    description: Structure the final list of verified interpolation sources into the
      API JSON response.
    name: format_interpolation_response
    nodes_depended_on:
    - verify_temporal_feasibility
    nodes_dependent_on: []
    output_structure:
    - description: List of verified song titles
      key: verified_songs
      type: List[str]
    - description: List of interpolated segment types (Melody or Harmony) corresponding
        to each verified song
      key: interpolated_segment_types
      type: List[str]
    - description: List of release years corresponding to each verified song
      key: release_years
      type: List[int]
    - description: List of artist names corresponding to each verified song
      key: artist_names
      type: List[str]
    prompt: Format the remaining list of verified songs into the final JSON response
      structure, including the interpolated segment type (Melody or Harmony).
  isolate_harmonic_chord_progression:
    agent: false
    description: Extract the underlying harmonic structure and chord progression of
      the song.
    name: isolate_harmonic_chord_progression
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of chords in the progression, represented as strings (e.g.,
        'C', 'G', 'Am')
      key: chord_progression
      type: List[str]
    - description: Description of the harmonic structure, including key, scale, and
        any notable harmonic features
      key: harmonic_structure
      type: str
    - description: Time signature of the song (e.g., '4/4', '3/4')
      key: time_signature
      type: str
    - description: Tempo of the song in beats per minute
      key: tempo
      type: int
    prompt: Process the provided audio signal to extract and notate the underlying
      chord progression and harmonic structure, excluding melody and percussion.
  isolate_melodic_riff_content:
    agent: false
    description: Separate the melodic instrumental riffs and leads from the rhythmic
      and percussive sections using audio source separation.
    name: isolate_melodic_riff_content
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The isolated melodic riff audio signal in a suitable format (e.g.,
        WAV, MP3)
      key: melodic_riff_audio
      type: str
    - description: The sample rate of the isolated melodic riff audio signal
      key: sample_rate
      type: int
    - description: The number of channels in the isolated melodic riff audio signal
      key: channels
      type: int
    - description: Whether the melodic riff content was successfully isolated
      key: ' Successful_isolation'
      type: bool
    prompt: Process the provided audio signal to isolate and output only the melodic
      lead lines and instrumental riffs, removing drums, bass, and ambient noise.
  merge_candidate_tracks:
    agent: false
    description: Combine the lists of candidates from melodic and harmonic searches
      and remove duplicates.
    name: merge_candidate_tracks
    nodes_depended_on:
    - search_database_melodic_matches
    - search_database_harmonic_matches
    nodes_dependent_on: []
    output_structure:
    - description: A unique list of track IDs that were found in either the melodic
        or harmonic search results.
      key: candidate_track_ids
      type: List[str]
    - description: The total number of unique candidate track IDs produced by merging
        the melodic and harmonic search lists.
      key: unique_candidate_count
      type: int
    prompt: Combine the two lists of track IDs into a single, unique list of candidate
      songs. Remove any duplicate entries.
  quantize_melodic_contours:
    agent: false
    description: Convert the isolated melodic audio into a structured sequence of
      musical intervals and pitch values.
    name: quantize_melodic_contours
    nodes_depended_on:
    - isolate_melodic_riff_content
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of MIDI note numbers extracted from the melodic contour.
      key: note_sequence
      type: List[int]
    - description: Sequence of pitch intervals (in semitones) between successive notes
        in the note_sequence.
      key: interval_sequence
      type: List[int]
    - description: Duration of each note in seconds, aligned with note_sequence.
      key: duration_sequence
      type: List[float]
    - description: Total number of notes identified in the melodic contour.
      key: num_notes
      type: int
    prompt: Convert the isolated melodic audio into a mathematical sequence representing
      pitch intervals and duration. Ignore rhythm, focus on the melodic contour sequence.
  retrieve_candidate_metadata:
    agent: false
    description: Fetch titles, artists, and release years for all identified candidate
      tracks.
    name: retrieve_candidate_metadata
    nodes_depended_on:
    - merge_candidate_tracks
    nodes_dependent_on: []
    output_structure:
    - description: List of unique track identifiers retrieved from the candidate list
      key: track_ids
      type: List[int]
    - description: List of song titles corresponding to each track ID
      key: titles
      type: List[str]
    - description: List of artist names corresponding to each track ID
      key: artists
      type: List[str]
    - description: List of release years for each track ID
      key: release_years
      type: List[int]
    prompt: For each track ID in the provided list, retrieve the Song Title, Artist
      Name, and Release Year from the database.
  retrieve_release_date_origin:
    agent: false
    description: Determine the release date of the input song to establish a timeline
      for interpolation.
    name: retrieve_release_date_origin
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The release date of the input song in ISO 8601 format (YYYY-MM-DD).
      key: release_date
      type: str
    - description: The source of the release date information (e.g., 'metadata', 'database_lookup').
      key: source
      type: str
    prompt: Identify the original release date of the input song provided by the user.
      If metadata is attached to the file, use it. Otherwise, perform a lookup based
      on the available song info.
  search_database_harmonic_matches:
    agent: false
    description: Query the internal music database for tracks with similar chord progression
      signatures.
    name: search_database_harmonic_matches
    nodes_depended_on:
    - extract_reference_audio_hash
    - fingerprint_chord_sequence
    nodes_dependent_on: []
    output_structure:
    - description: List of track IDs with matching harmonic structures
      key: matched_track_ids
      type: List[str]
    - description: List of confidence levels for each matched track ID, ranging from
        0 to 1
      key: match_confidence_levels
      type: List[float]
    prompt: Query the music database using the provided chord progression signature
      and audio hash. Return a list of track IDs where the harmonic structure matches
      closely.
  search_database_melodic_matches:
    agent: false
    description: Query the internal music database for tracks with similar melodic
      interval sequences.
    name: search_database_melodic_matches
    nodes_depended_on:
    - extract_reference_audio_hash
    - quantize_melodic_contours
    nodes_dependent_on: []
    output_structure:
    - description: A list of track IDs that have melodic interval sequences significantly
        similar to the input song.
      key: candidate_track_ids
      type: List[str]
    prompt: Query the music database using the provided melodic interval sequence
      and audio hash. Return a list of track IDs where the melodic contour shares
      a significant similarity.
  verify_temporal_feasibility:
    agent: false
    description: Filter the candidate list to include only songs released prior to
      the input song.
    name: verify_temporal_feasibility
    nodes_depended_on:
    - retrieve_candidate_metadata
    - retrieve_release_date_origin
    nodes_dependent_on: []
    output_structure:
    - description: List of candidate track IDs that were released before the input
        song
      key: filtered_candidate_ids
      type: List[str]
    - description: Number of candidates remaining after temporal filtering
      key: filtered_count
      type: int
    - description: Indicates whether the filtering operation completed without errors
      key: is_successful
      type: bool
    prompt: Compare the release dates of the candidate songs against the release date
      of the input song. Remove any candidates from the list that were released after
      the input song.
