dag_type: typed
description: Generated workflow from UI.
name: musical_interpolation_finder_service
nodes:
  extract_reference_audio_hash:
    agent: false
    description: Generate a spectrogram fingerprint or audio hash of the input song
      to establish a unique audio signature for matching.
    name: extract_reference_audio_hash
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A unique identifier for the generated hash, typically a UUID or
        similar.
      key: hash_id
      type: str
    - description: The name of the algorithm used to compute the hash (e.g., 'pHash',
        'Chromaprint').
      key: hash_algorithm
      type: str
    - description: The hexadecimal or base64 encoded string representing the audio
        hash.
      key: hash_value
      type: str
    prompt: Analyze the provided audio file and generate a unique spectrogram fingerprint
      or acoustic hash that represents the unique sonic characteristics of the track.
      Output the hash data.
  fingerprint_chord_sequence:
    agent: false
    description: Create a searchable signature of the chord progression to compare
      against known databases.
    name: fingerprint_chord_sequence
    nodes_depended_on:
    - isolate_harmonic_chord_progression
    nodes_dependent_on: []
    output_structure:
    - description: A normalized string representing the chord progression signature
      key: chord_progression_signature
      type: str
    - description: A vector representation of the chord progression, where each element
        is a float value
      key: chord_sequence_vector
      type: List[float]
    prompt: Transform the extracted chord progression into a normalized string or
      vector signature suitable for database similarity matching.
  format_interpolation_response:
    agent: false
    description: Structure the final list of verified interpolation sources into the
      API JSON response.
    name: format_interpolation_response
    nodes_depended_on:
    - verify_temporal_feasibility
    nodes_dependent_on: []
    output_structure:
    - description: List of verified song titles that contain interpolated segments
      key: interpolated_songs
      type: List[str]
    - description: List of interpolated segment types (Melody or Harmony) corresponding
        to each song
      key: interpolated_segment_types
      type: List[str]
    - description: List of artist names corresponding to each interpolated song
      key: artist_names
      type: List[str]
    - description: List of release years corresponding to each interpolated song
      key: release_years
      type: List[int]
    - description: Total number of interpolated segments found
      key: num_interpolations
      type: int
    prompt: Format the remaining list of verified songs into the final JSON response
      structure, including the interpolated segment type (Melody or Harmony).
  isolate_harmonic_chord_progression:
    agent: false
    description: Extract the underlying harmonic structure and chord progression of
      the song.
    name: isolate_harmonic_chord_progression
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The extracted chord progression as a list of chord names (e.g.,
        ['C', 'G', 'Am', 'F'])
      key: chord_progression
      type: List[str]
    - description: The underlying harmonic structure of the song (e.g., 'key of C
        major', 'minor pentatonic scale')
      key: harmonic_structure
      type: str
    - description: The time signature of the song (e.g., '4/4', '3/4')
      key: time_signature
      type: str
    - description: The key of the song (e.g., 'C major', 'A minor')
      key: key
      type: str
    prompt: Process the provided audio signal to extract and notate the underlying
      chord progression and harmonic structure, excluding melody and percussion.
  isolate_melodic_riff_content:
    agent: false
    description: Separate the melodic instrumental riffs and leads from the rhythmic
      and percussive sections using audio source separation.
    name: isolate_melodic_riff_content
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The isolated melodic riff audio signal
      key: melodic_riff_audio
      type: str
    - description: The frequency range of the isolated melodic riff
      key: riff_frequency_range
      type: List[float]
    - description: The signal to noise ratio of the isolated melodic riff
      key: signal_to_noise_ratio
      type: float
    prompt: Process the provided audio signal to isolate and output only the melodic
      lead lines and instrumental riffs, removing drums, bass, and ambient noise.
  merge_candidate_tracks:
    agent: false
    description: Combine the lists of candidates from melodic and harmonic searches
      and remove duplicates.
    name: merge_candidate_tracks
    nodes_depended_on:
    - search_database_melodic_matches
    - search_database_harmonic_matches
    nodes_dependent_on: []
    output_structure:
    - description: A list of unique track IDs representing candidate songs from both
        melodic and harmonic searches.
      key: candidate_track_ids
      type: List[str]
    - description: The total number of unique candidate track IDs produced.
      key: candidate_count
      type: int
    prompt: Combine the two lists of track IDs into a single, unique list of candidate
      songs. Remove any duplicate entries.
  quantize_melodic_contours:
    agent: false
    description: Convert the isolated melodic audio into a structured sequence of
      musical intervals and pitch values.
    name: quantize_melodic_contours
    nodes_depended_on:
    - isolate_melodic_riff_content
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of MIDI note numbers representing the melodic contour.
      key: pitch_sequence
      type: List[int]
    - description: Ordered list of semitone intervals between consecutive pitches
        in the contour.
      key: interval_sequence
      type: List[int]
    - description: Total number of notes in the melodic sequence.
      key: note_count
      type: int
    prompt: Convert the isolated melodic audio into a mathematical sequence representing
      pitch intervals and duration. Ignore rhythm, focus on the melodic contour sequence.
  retrieve_candidate_metadata:
    agent: false
    description: Fetch titles, artists, and release years for all identified candidate
      tracks.
    name: retrieve_candidate_metadata
    nodes_depended_on:
    - merge_candidate_tracks
    nodes_dependent_on: []
    output_structure:
    - description: List of candidate track IDs returned from the merge step.
      key: track_ids
      type: List[int]
    - description: List of song titles corresponding to each candidate track ID.
      key: song_titles
      type: List[str]
    - description: List of artist names corresponding to each candidate track ID.
      key: artist_names
      type: List[str]
    - description: List of release years (as four‑digit strings) corresponding to
        each candidate track ID.
      key: release_years
      type: List[str]
    prompt: For each track ID in the provided list, retrieve the Song Title, Artist
      Name, and Release Year from the database.
  retrieve_release_date_origin:
    agent: false
    description: Determine the release date of the input song to establish a timeline
      for interpolation.
    name: retrieve_release_date_origin
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The release date of the input song in a standard format (e.g.,
        YYYY-MM-DD)
      key: release_date
      type: str
    - description: The release year of the input song
      key: release_year
      type: int
    - description: The title of the input song
      key: song_title
      type: str
    - description: The name of the artist or band that released the input song
      key: artist_name
      type: str
    prompt: Identify the original release date of the input song provided by the user.
      If metadata is attached to the file, use it. Otherwise, perform a lookup based
      on the available song info.
  search_database_harmonic_matches:
    agent: false
    description: Query the internal music database for tracks with similar chord progression
      signatures.
    name: search_database_harmonic_matches
    nodes_depended_on:
    - extract_reference_audio_hash
    - fingerprint_chord_sequence
    nodes_dependent_on: []
    output_structure:
    - description: List of unique track identifiers that match the harmonic signature
        of the input song.
      key: candidate_track_ids
      type: List[str]
    - description: Total number of tracks returned in candidate_track_ids.
      key: match_count
      type: int
    prompt: Query the music database using the provided chord progression signature
      and audio hash. Return a list of track IDs where the harmonic structure matches
      closely.
  search_database_melodic_matches:
    agent: false
    description: Query the internal music database for tracks with similar melodic
      interval sequences.
    name: search_database_melodic_matches
    nodes_depended_on:
    - extract_reference_audio_hash
    - quantize_melodic_contours
    nodes_dependent_on: []
    output_structure:
    - description: A list of unique track identifiers that match the melodic interval
        sequence and audio hash.
      key: candidate_track_ids
      type: List[str]
    - description: The total number of matching candidate tracks found.
      key: match_count
      type: int
    - description: Indicates whether any matches were found (true if match_count >
        0).
      key: has_matches
      type: bool
    prompt: Query the music database using the provided melodic interval sequence
      and audio hash. Return a list of track IDs where the melodic contour shares
      a significant similarity.
  verify_temporal_feasibility:
    agent: false
    description: Filter the candidate list to include only songs released prior to
      the input song.
    name: verify_temporal_feasibility
    nodes_depended_on:
    - retrieve_candidate_metadata
    - retrieve_release_date_origin
    nodes_dependent_on: []
    output_structure:
    - description: List of track IDs that remain after filtering for temporal feasibility
      key: candidate_ids
      type: List[int]
    - description: List of song titles corresponding to the filtered track IDs
      key: candidate_titles
      type: List[str]
    - description: List of artist names corresponding to the filtered track IDs
      key: candidate_artists
      type: List[str]
    - description: List of release years corresponding to the filtered track IDs
      key: candidate_release_years
      type: List[int]
    prompt: Compare the release dates of the candidate songs against the release date
      of the input song. Remove any candidates from the list that were released after
      the input song.
