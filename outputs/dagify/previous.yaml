dag_type: typed
description: Generated workflow from UI.
name: musical_interpolation_finder_service
nodes:
  extract_reference_audio_hash:
    agent: false
    description: Generate a spectrogram fingerprint or audio hash of the input song
      to establish a unique audio signature for matching.
    name: extract_reference_audio_hash
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A base64‑encoded string representing the spectrogram fingerprint
        or acoustic hash of the input audio file.
      key: audio_hash
      type: str
    - description: The name of the algorithm used to generate the hash (e.g., "SpectralHashV1",
        "AudioFingerprint32").
      key: hash_algorithm
      type: str
    - description: The length in bits of the generated hash.
      key: hash_length
      type: int
    prompt: Analyze the provided audio file and generate a unique spectrogram fingerprint
      or acoustic hash that represents the unique sonic characteristics of the track.
      Output the hash data.
  fingerprint_chord_sequence:
    agent: false
    description: Create a searchable signature of the chord progression to compare
      against known databases.
    name: fingerprint_chord_sequence
    nodes_depended_on:
    - isolate_harmonic_chord_progression
    nodes_dependent_on: []
    output_structure:
    - description: A normalized string representing the chord progression signature
      key: chord_progression_signature
      type: str
    - description: List of chord intervals in the progression
      key: chord_intervals
      type: List[str]
    - description: List of weights for each chord in the progression, representing
        their importance
      key: chord_weights
      type: List[float]
    prompt: Transform the extracted chord progression into a normalized string or
      vector signature suitable for database similarity matching.
  format_interpolation_response:
    agent: false
    description: Structure the final list of verified interpolation sources into the
      API JSON response.
    name: format_interpolation_response
    nodes_depended_on:
    - verify_temporal_feasibility
    nodes_dependent_on: []
    output_structure:
    - description: List of song titles that have been identified as interpolated sources
      key: interpolated_songs
      type: List[str]
    - description: List of segment types (Melody or Harmony) corresponding to each
        interpolated song
      key: interpolated_segment_types
      type: List[str]
    - description: List of release years corresponding to each interpolated song
      key: release_years
      type: List[int]
    - description: List of artist names corresponding to each interpolated song
      key: artists
      type: List[str]
    - description: Whether the interpolation response was successfully formatted
      key: success
      type: bool
    prompt: Format the remaining list of verified songs into the final JSON response
      structure, including the interpolated segment type (Melody or Harmony).
  isolate_harmonic_chord_progression:
    agent: false
    description: Extract the underlying harmonic structure and chord progression of
      the song.
    name: isolate_harmonic_chord_progression
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The extracted chord progression as a string of chord symbols (e.g.,
        'C - G - Am - F')
      key: chord_progression
      type: str
    - description: The underlying harmonic structure of the song, represented as a
        string of functional harmonies (e.g., 'T - D - SD - T')
      key: harmonic_structure
      type: str
    - description: The key signature of the song, represented as a string (e.g., 'C
        major', 'A minor')
      key: key_signature
      type: str
    - description: The time signature of the song, represented as a string (e.g.,
        '4/4', '3/4')
      key: time_signature
      type: str
    prompt: Process the provided audio signal to extract and notate the underlying
      chord progression and harmonic structure, excluding melody and percussion.
  isolate_melodic_riff_content:
    agent: false
    description: Separate the melodic instrumental riffs and leads from the rhythmic
      and percussive sections using audio source separation.
    name: isolate_melodic_riff_content
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The isolated melodic riff audio signal as a string representation
      key: melodic_riff_audio
      type: str
    - description: The sample rate of the isolated melodic riff audio signal
      key: sample_rate
      type: int
    - description: The number of audio channels in the isolated melodic riff signal
      key: channel_count
      type: int
    - description: The format of the isolated melodic riff audio signal (e.g., WAV,
        MP3)
      key: audio_format
      type: str
    prompt: Process the provided audio signal to isolate and output only the melodic
      lead lines and instrumental riffs, removing drums, bass, and ambient noise.
  merge_candidate_tracks:
    agent: false
    description: Combine the lists of candidates from melodic and harmonic searches
      and remove duplicates.
    name: merge_candidate_tracks
    nodes_depended_on:
    - search_database_melodic_matches
    - search_database_harmonic_matches
    nodes_dependent_on: []
    output_structure:
    - description: A list of unique track IDs that were found in either the melodic
        or harmonic search results.
      key: unique_candidate_ids
      type: List[str]
    - description: The total number of unique candidate track IDs in the output list.
      key: candidate_count
      type: int
    prompt: Combine the two lists of track IDs into a single, unique list of candidate
      songs. Remove any duplicate entries.
  quantize_melodic_contours:
    agent: false
    description: Convert the isolated melodic audio into a structured sequence of
      musical intervals and pitch values.
    name: quantize_melodic_contours
    nodes_depended_on:
    - isolate_melodic_riff_content
    nodes_dependent_on: []
    output_structure:
    - description: List of pitch intervals representing the melodic contour
      key: melodic_contour_sequence
      type: List[float]
    - description: List of pitch values corresponding to the melodic contour sequence
      key: pitch_values
      type: List[int]
    - description: Duration of the melodic contour sequence
      key: duration
      type: float
    - description: Whether the melodic contour sequence is valid
      key: is_valid
      type: bool
    prompt: Convert the isolated melodic audio into a mathematical sequence representing
      pitch intervals and duration. Ignore rhythm, focus on the melodic contour sequence.
  retrieve_candidate_metadata:
    agent: false
    description: Fetch titles, artists, and release years for all identified candidate
      tracks.
    name: retrieve_candidate_metadata
    nodes_depended_on:
    - merge_candidate_tracks
    nodes_dependent_on: []
    output_structure:
    - description: List of song titles corresponding to the candidate track IDs
      key: titles
      type: List[str]
    - description: List of artist names corresponding to the candidate track IDs
      key: artists
      type: List[str]
    - description: List of release years corresponding to the candidate track IDs
      key: release_years
      type: List[int]
    prompt: For each track ID in the provided list, retrieve the Song Title, Artist
      Name, and Release Year from the database.
  retrieve_release_date_origin:
    agent: false
    description: Determine the release date of the input song to establish a timeline
      for interpolation.
    name: retrieve_release_date_origin
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The full release date of the input song in ISO 8601 format (YYYY-MM-DD).
        If only year is known, return YYYY-01-01.
      key: release_date
      type: str
    - description: The four‑digit year extracted from the release date.
      key: release_year
      type: int
    - description: True if the release date was successfully determined; False otherwise.
      key: is_known
      type: bool
    prompt: Identify the original release date of the input song provided by the user.
      If metadata is attached to the file, use it. Otherwise, perform a lookup based
      on the available song info.
  search_database_harmonic_matches:
    agent: false
    description: Query the internal music database for tracks with similar chord progression
      signatures.
    name: search_database_harmonic_matches
    nodes_depended_on:
    - extract_reference_audio_hash
    - fingerprint_chord_sequence
    nodes_dependent_on: []
    output_structure:
    - description: List of unique track identifiers that match the harmonic signature.
      key: track_ids
      type: List[str]
    - description: The total number of tracks found that meet the harmonic similarity
        threshold.
      key: match_count
      type: int
    - description: Indicates whether the query executed successfully and returned
        results.
      key: is_valid
      type: bool
    prompt: Query the music database using the provided chord progression signature
      and audio hash. Return a list of track IDs where the harmonic structure matches
      closely.
  search_database_melodic_matches:
    agent: false
    description: Query the internal music database for tracks with similar melodic
      interval sequences.
    name: search_database_melodic_matches
    nodes_depended_on:
    - extract_reference_audio_hash
    - quantize_melodic_contours
    nodes_dependent_on: []
    output_structure:
    - description: A list of unique track identifiers from the database that match
        the melodic interval sequence.
      key: candidate_track_ids
      type: List[str]
    prompt: Query the music database using the provided melodic interval sequence
      and audio hash. Return a list of track IDs where the melodic contour shares
      a significant similarity.
  verify_temporal_feasibility:
    agent: false
    description: Filter the candidate list to include only songs released prior to
      the input song.
    name: verify_temporal_feasibility
    nodes_depended_on:
    - retrieve_candidate_metadata
    - retrieve_release_date_origin
    nodes_dependent_on: []
    output_structure:
    - description: List of track IDs that were released before the input song
      key: filtered_candidate_tracks
      type: List[str]
    - description: List of track IDs that were excluded due to being released after
        the input song
      key: excluded_tracks
      type: List[str]
    - description: Whether the temporal feasibility check was successful
      key: is_feasible
      type: bool
    prompt: Compare the release dates of the candidate songs against the release date
      of the input song. Remove any candidates from the list that were released after
      the input song.
